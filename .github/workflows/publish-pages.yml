name: publish SCOTUS static Pages

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Fixture preview or bounded live publication mode
        required: true
        default: fixture
        type: choice
        options: [fixture, nightly, bootstrap, activity-migration, initial-empty, poc-import]
      deploy:
        description: Request deployment after all configured gates and validations pass
        required: true
        default: false
        type: boolean
      expected_live_release_id:
        description: Verified live release ID for a protected pre-TLS manual run
        required: false
        default: ""
        type: string
      authorized_replay:
        description: Explicitly replay unchanged local-model input after reviewed failure
        required: false
        default: false
        type: boolean
      maximum_cases:
        description: Optional lower case bound for a reviewed live validation run (0 uses config)
        required: false
        default: 0
        type: number
      editorial_rollout_stage:
        description: Reviewed publication-disabled editorial migration stage
        required: true
        default: disabled
        type: choice
        options: [disabled, canary_10, batch_25, batch_100]

concurrency:
  group: scotus-pages-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  CANONICAL_ORIGIN: https://scotusbriefs.us
  PROJECT_BASE_PATH: /
  REVIEWED_OLLAMA_MODEL: cogito:70b
  REVIEWED_OLLAMA_MODEL_DIGEST: 8f2632d0faa422ff60435bc0095575d032a8b4a0f728df034d90ea654ffb60bb
  REVIEWED_CONTROL_OLLAMA_MODEL: qwen3.8:27b
  REVIEWED_CONTROL_OLLAMA_MODEL_DIGEST: 22130167c4c20e20c7b71454612966ca8e8171e9b3cc8ab6ce8aa6cbfec79643
  RAGCHEW_SOURCE_USER_AGENT: >-
    ragchew-scotus-briefs/1.0 (+https://github.com/reklis/scotus-briefs; contact=https://github.com/reklis)

jobs:
  paired-control:
    name: Build contemporaneous Qwen control
    if: github.event_name == 'workflow_dispatch' && inputs.editorial_rollout_stage == 'canary_10' && inputs.deploy != true && inputs.mode == 'nightly' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, spark]
    timeout-minutes: 330
    environment: scotus-publication
    permissions:
      contents: read
    outputs:
      runner_name: ${{ steps.runner_identity.outputs.name }}
    steps:
      - name: Record protected runner identity
        id: runner_identity
        run: echo "name=$RUNNER_NAME" >> "$GITHUB_OUTPUT"
      - name: Clean persistent runner before paired canary
        run: |
          set -euo pipefail
          test "$(findmnt -n -o FSTYPE /dev/shm)" = "tmpfs"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          find /dev/shm -mindepth 1 -maxdepth 1 -name 'ragchew-scotus-*' -exec rm -rf -- {} +
          rm -rf "$RUNNER_TEMP/ragchew-qwen-control"
          install -d -m 700 "$RUNNER_TEMP/ragchew-qwen-control" \
            "/dev/shm/ragchew-scotus-$GITHUB_RUN_ID"
          env -u RUNNER_TRACKING_ID nohup sh -c \
            'sleep 86400; rm -rf -- "$1"' sh \
            "/dev/shm/ragchew-scotus-$GITHUB_RUN_ID" >/dev/null 2>&1 &
      - name: Require the protected default branch for paired canary
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: test "$REF_PROTECTED" = true
      - name: Check out paired-canary source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out paired-canary parent state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated-content
          path: generated-content-input
          fetch-depth: 1
          persist-credentials: false
      - name: Install paired-canary dependencies
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --frozen
      - name: Preflight both exact paired model identities before Court access
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            http://127.0.0.1:11434/api/tags | \
            uv run python -c 'import json,os,sys; from ragchew.config import ScotusConfig; config=ScotusConfig.from_yaml("config/scotus.yaml"); models=json.load(sys.stdin).get("models", []); installed={(item.get("name"),item.get("digest")) for item in models if isinstance(item,dict)}; expected={(os.environ["REVIEWED_OLLAMA_MODEL"],os.environ["REVIEWED_OLLAMA_MODEL_DIGEST"]),(os.environ["REVIEWED_CONTROL_OLLAMA_MODEL"],os.environ["REVIEWED_CONTROL_OLLAMA_MODEL_DIGEST"])}; configured={(config.generation.model,config.generation.model_digest),(config.editorial_backfill.control_model,config.editorial_backfill.control_model_digest)}; raise SystemExit(0 if configured == expected and expected <= installed else "paired exact Ollama identities are unavailable")'
      - name: Reconcile paired-canary parent before Court access
        env:
          EXPECTED_LIVE_RELEASE_ID: ${{ inputs.expected_live_release_id || '' }}
        run: |
          set -euo pipefail
          canonical_release_url="${CANONICAL_ORIGIN}${PROJECT_BASE_PATH}release/v1/release.json"
          if [[ -n "$EXPECTED_LIVE_RELEASE_ID" ]]; then
            [[ "$EXPECTED_LIVE_RELEASE_ID" =~ ^[0-9a-f]{64}$ ]]
            live_args=(--live-release-id "$EXPECTED_LIVE_RELEASE_ID")
          else
            marker="$RUNNER_TEMP/paired-live-release.json"
            if ! curl --proto '=https' --fail --silent --show-error --connect-timeout 5 \
              --max-time 30 --output "$marker" "$canonical_release_url"; then
              curl --proto '=http' --fail --silent --show-error --connect-timeout 5 \
                --max-time 30 --output "$marker" "${canonical_release_url/https:/http:}"
            fi
            live_release_id="$(uv run python -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_id"])' "$marker")"
            rm -f "$marker"
            live_args=(--live-release-id "$live_release_id")
          fi
          uv run ragchew-scotus-static reconcile \
            --state-dir generated-content-input "${live_args[@]}" --fail-on-split
      - name: Record exact Court snapshot with Qwen control arm
        id: control
        timeout-minutes: 315
        env:
          RAGCHEW_SCOTUS_BATCH_ADAPTER: ragchew.scotus.live_static:LiveStaticBatchAdapter
          RAGCHEW_OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
          RAGCHEW_SCOTUS_EVIDENCE_CACHE_MODE: record
          RAGCHEW_SCOTUS_EVIDENCE_CACHE_PATH: /dev/shm/ragchew-scotus-${{ github.run_id }}
        run: |
          set -euo pipefail
          uv run ragchew-scotus-static batch \
            --mode nightly \
            --state-dir generated-content-input --candidate-state-dir control-state \
            --output control-site --workspace "$RUNNER_TEMP/ragchew-qwen-control" \
            --review-artifact sanitized-control-review.json \
            --source-commit "$GITHUB_SHA" --build-epoch "$(git show -s --format=%cI HEAD)" \
            --editorial-rollout-stage canary_10 \
            --replacement-comparison-role control \
            --comparison-baseline contemporaneous-control-baseline.json
      - name: Validate control receipts after any outcome
        id: control_receipts
        if: always()
        run: |
          receipt="$RUNNER_TEMP/ragchew-qwen-control/public-cost-receipts.json"
          if [[ -f "$receipt" ]]; then
            uv run ragchew-scotus-static persist-cost-receipts \
              --receipts "$receipt" --validate-only
            cp "$receipt" control-public-cost-receipts.json
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload control receipts after any model attempt
        if: always() && steps.control_receipts.outcome == 'success' && steps.control_receipts.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opaque-control-cost-receipts
          path: control-public-cost-receipts.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload complete sanitized control binding
        if: steps.control.outcome == 'success' && steps.control_receipts.outcome == 'success' && hashFiles('contemporaneous-control-baseline.json') != '' && hashFiles('sanitized-control-review.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paired-control-input
          path: |
            contemporaneous-control-baseline.json
            sanitized-control-review.json
            control-site
            control-state
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Purge volatile evidence after failed control
        if: failure() || cancelled()
        run: rm -rf -- "/dev/shm/ragchew-scotus-$GITHUB_RUN_ID"
      - name: Clean persistent runner after control
        if: always()
        run: |
          set -euo pipefail
          chmod -R u+rwX "$RUNNER_TEMP/ragchew-qwen-control" "$GITHUB_WORKSPACE" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/ragchew-qwen-control"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test ! -e "$RUNNER_TEMP/ragchew-qwen-control"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

  build:
    needs: [paired-control]
    if: always() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.editorial_rollout_stage != 'canary_10' || needs.paired-control.result == 'success')
    name: Build and scan candidate
    runs-on: [self-hosted, spark]
    timeout-minutes: 360
    environment: scotus-publication
    permissions:
      contents: read
    outputs:
      release_changed: ${{ steps.batch.outputs.release_changed }}
      publication_ready: ${{ steps.batch.outputs.publication_ready }}
      release_id: ${{ steps.batch.outputs.release_id }}
      expected_parent_release_id: ${{ steps.batch.outputs.expected_parent_release_id }}
      expected_parent_digest: ${{ steps.batch.outputs.expected_parent_digest }}
      expected_parent_commit: ${{ steps.state_sha.outputs.commit }}
      receipts_present: ${{ steps.receipts.outputs.present }}
    steps:
      - name: Require paired runner affinity before candidate work
        if: inputs.editorial_rollout_stage == 'canary_10'
        env:
          CONTROL_RUNNER_NAME: ${{ needs.paired-control.outputs.runner_name }}
        run: test "$RUNNER_NAME" = "$CONTROL_RUNNER_NAME"
      - name: Clean persistent runner before build
        run: |
          set -euo pipefail
          test "$(findmnt -n -o FSTYPE /dev/shm)" = "tmpfs"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          find /dev/shm -mindepth 1 -maxdepth 1 -name 'ragchew-scotus-*' \
            ! -name "ragchew-scotus-$GITHUB_RUN_ID" -exec rm -rf -- {} +
          rm -rf "$RUNNER_TEMP/ragchew-private" \
            "$RUNNER_TEMP/ragchew-qwen-control" "$RUNNER_TEMP/ragchew-cogito-candidate"
          install -d -m 700 "$RUNNER_TEMP/ragchew-private"
      - name: Require the protected default branch
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$REF_PROTECTED" != "true" ]]; then
            echo "Publication stopped: the default branch is not protected." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Check out source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out public generated state separately
        id: state
        if: (inputs.mode || 'nightly') != 'fixture'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated-content
          path: generated-content-input
          fetch-depth: 1
          persist-credentials: false
      - name: Download complete paired-control binding
        if: inputs.editorial_rollout_stage == 'canary_10'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: paired-control-input
          path: paired-control-input
      - name: Download paired-control receipts
        if: inputs.editorial_rollout_stage == 'canary_10'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opaque-control-cost-receipts
          path: paired-control-receipts
      - name: Check out validated POC import candidate separately
        if: inputs.mode == 'poc-import'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: poc-import-candidate
          path: poc-import-input
          fetch-depth: 1
          persist-credentials: false
      - name: Record the actual generated-content branch SHA
        id: state_sha
        run: |
          set -euo pipefail
          if [[ -d generated-content-input ]]; then
            echo "commit=$(git -C generated-content-input rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "commit=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install frozen dependencies
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --frozen
      - name: Preflight exact local Ollama model identities
        if: (inputs.mode || 'nightly') != 'activity-migration'
        env:
          RAGCHEW_OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
          EDITORIAL_ROLLOUT_STAGE: ${{ inputs.editorial_rollout_stage || 'disabled' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 30 \
            http://127.0.0.1:11434/api/tags | \
            uv run python -c 'import json,os,sys; from ragchew.config import ScotusConfig; config=ScotusConfig.from_yaml("config/scotus.yaml"); models=json.load(sys.stdin).get("models", []); installed={(item.get("name"),item.get("digest")) for item in models if isinstance(item,dict)}; production=(os.environ["REVIEWED_OLLAMA_MODEL"],os.environ["REVIEWED_OLLAMA_MODEL_DIGEST"]); control=(os.environ["REVIEWED_CONTROL_OLLAMA_MODEL"],os.environ["REVIEWED_CONTROL_OLLAMA_MODEL_DIGEST"]); required={production}; required |= {control} if os.environ["EDITORIAL_ROLLOUT_STAGE"] == "canary_10" else set(); configured=(config.generation.model,config.generation.model_digest)==production and (config.editorial_backfill.control_model,config.editorial_backfill.control_model_digest)==control; raise SystemExit(0 if configured and required <= installed else "required exact local Ollama model identities are unavailable")'
      - name: Create permission-restricted private parent only
        run: |
          set -euo pipefail
          if [[ ! -d generated-content-input ]]; then install -d -m 700 generated-content-input; fi
          test ! -e candidate-site
          test ! -e candidate-state
      - name: Reconcile release IDs before live source access
        if: (inputs.mode || 'nightly') != 'fixture'
        env:
          PUBLICATION_MODE: ${{ inputs.mode || 'nightly' }}
          EXPECTED_LIVE_RELEASE_ID: ${{ inputs.expected_live_release_id || '' }}
        run: |
          set -euo pipefail
          bootstrap_args=()
          if [[ "$PUBLICATION_MODE" == "bootstrap" || "$PUBLICATION_MODE" == "initial-empty" || "$PUBLICATION_MODE" == "poc-import" ]]; then
            bootstrap_args+=(--allow-missing-live-bootstrap)
          fi
          canonical_release_url="${CANONICAL_ORIGIN}${PROJECT_BASE_PATH}release/v1/release.json"
          live_args=(--live-release-url "$canonical_release_url")
          if [[ -n "$EXPECTED_LIVE_RELEASE_ID" ]]; then
            if [[ "$PUBLICATION_MODE" != "poc-import" && "$PUBLICATION_MODE" != "nightly" && "$PUBLICATION_MODE" != "activity-migration" ]] || [[ ! "$EXPECTED_LIVE_RELEASE_ID" =~ ^[0-9a-f]{64}$ ]]; then
              echo "A supplied live release ID is permitted only for a protected pre-TLS import, activity migration, or nightly run." >&2
              exit 1
            fi
            live_args=(--live-release-id "$EXPECTED_LIVE_RELEASE_ID")
          elif [[ "$PUBLICATION_MODE" == "nightly" || "$PUBLICATION_MODE" == "activity-migration" ]]; then
            marker="$RUNNER_TEMP/live-release.json"
            if ! curl --proto '=https' --fail --silent --show-error --connect-timeout 5 \
              --max-time 30 --output "$marker" "$canonical_release_url"; then
              pre_tls_url="${canonical_release_url/https:/http:}"
              curl --proto '=http' --fail --silent --show-error --connect-timeout 5 \
                --max-time 30 --output "$marker" "$pre_tls_url"
            fi
            live_release_id="$(uv run python -c 'import sys; from ragchew.scotus.static_contracts import ReleaseManifest; print(ReleaseManifest.model_validate_json(open(sys.argv[1], "rb").read()).release_id)' "$marker")"
            rm -f "$marker"
            live_args=(--live-release-id "$live_release_id")
          fi
          uv run ragchew-scotus-static reconcile \
            --state-dir generated-content-input \
            "${live_args[@]}" \
            --fail-on-split "${bootstrap_args[@]}"
      - name: Re-render and validate accepted POC public briefs
        id: import_batch
        if: inputs.mode == 'poc-import'
        run: |
          set -euo pipefail
          uv run ragchew-scotus-static render-import-candidate \
            --state-dir poc-import-input --parent-state-dir generated-content-input \
            --candidate-state-dir candidate-state --output candidate-site \
            --github-output "$GITHUB_OUTPUT"
      - name: Build verified initial empty site without Court/model access
        id: empty_batch
        if: inputs.mode == 'initial-empty'
        run: |
          set -euo pipefail
          uv run ragchew-scotus-static publish-empty-bootstrap \
            --state-dir generated-content-input --candidate-state-dir candidate-state \
            --output candidate-site --source-commit "$GITHUB_SHA" \
            --build-epoch "$(git show -s --format=%cI HEAD)" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build no-model activity-contract migration
        id: migration_batch
        if: inputs.mode == 'activity-migration'
        run: |
          set -euo pipefail
          uv run ragchew-scotus-static migrate-activity-contracts \
            --state-dir generated-content-input --candidate-state-dir candidate-state \
            --output candidate-site --source-commit "$GITHUB_SHA" \
            --build-epoch "$(git show -s --format=%cI HEAD)" \
            --expected-parent-release-id "$(uv run python -c 'import json; print(json.load(open("generated-content-input/release/v1/release.json"))["release_id"])')" \
            --github-output "$GITHUB_OUTPUT"
      - name: Run reviewed bounded live adapter
        id: live_batch
        timeout-minutes: 345
        if: (inputs.mode || 'nightly') != 'fixture' && inputs.mode != 'initial-empty' && inputs.mode != 'poc-import' && inputs.mode != 'activity-migration'
        env:
          PUBLICATION_MODE: ${{ inputs.mode || 'nightly' }}
          AUTHORIZED_REPLAY: ${{ inputs.authorized_replay || false }}
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
          MAXIMUM_CASES: ${{ inputs.maximum_cases || 0 }}
          EDITORIAL_ROLLOUT_STAGE: ${{ inputs.editorial_rollout_stage || 'disabled' }}
          DEPLOY_REQUESTED: ${{ inputs.deploy || false }}
          RAGCHEW_SCOTUS_BATCH_ADAPTER: ragchew.scotus.live_static:LiveStaticBatchAdapter
          RAGCHEW_OLLAMA_BASE_URL: http://127.0.0.1:11434/v1
        run: |
          set -euo pipefail
          replay_args=()
          scheduled_retry_args=()
          case_args=()
          editorial_args=()
          if [[ "$EDITORIAL_ROLLOUT_STAGE" != "disabled" ]]; then
            if [[ "${{ github.event_name }}" != "workflow_dispatch" || "$PUBLICATION_MODE" != "nightly" ]]; then
              echo "Editorial rollout stages require an explicit protected manual nightly run." >&2
              exit 1
            fi
            if [[ "$DEPLOY_REQUESTED" == "true" ]]; then
              echo "Measured editorial stages are publication-disabled; rerun with deploy=false." >&2
              exit 1
            fi
            editorial_args+=(--editorial-rollout-stage "$EDITORIAL_ROLLOUT_STAGE")
          fi
          if [[ "$MAXIMUM_CASES" != "0" ]]; then
            if [[ ! "$MAXIMUM_CASES" =~ ^[1-9][0-9]*$ ]]; then
              echo "maximum_cases must be zero or a positive integer." >&2
              exit 1
            fi
            case_args+=(--maximum-cases "$MAXIMUM_CASES")
          fi
          if [[ "$AUTHORIZED_REPLAY" == "true" ]]; then
            if [[ "$PUBLICATION_MODE" != "nightly" || "${{ github.event_name }}" != "workflow_dispatch" ]]; then
              echo "Model replay is allowed only for an explicit manual nightly run." >&2
              exit 1
            fi
            replay_args+=(--authorized-replay)
          fi
          if [[ "$SCHEDULED_RUN" == "true" ]]; then
            if [[ "$PUBLICATION_MODE" != "nightly" ]]; then
              echo "Automatic model retries are allowed only on the nightly schedule." >&2
              exit 1
            fi
            scheduled_retry_args+=(--scheduled-retries)
          fi
          if [[ "$EDITORIAL_ROLLOUT_STAGE" == "canary_10" ]]; then
            if [[ "$MAXIMUM_CASES" != "0" || "$AUTHORIZED_REPLAY" == "true" || "$SCHEDULED_RUN" == "true" ]]; then
              echo "Paired replacement canary forbids case overrides and replay modes." >&2
              exit 1
            fi
            install -d -m 700 "$RUNNER_TEMP/ragchew-cogito-candidate"
            RAGCHEW_SCOTUS_EVIDENCE_CACHE_MODE=replay \
              RAGCHEW_SCOTUS_EVIDENCE_CACHE_PATH="/dev/shm/ragchew-scotus-$GITHUB_RUN_ID" \
              uv run ragchew-scotus-static batch \
              --mode nightly \
              --state-dir generated-content-input --candidate-state-dir candidate-state \
              --output candidate-site --workspace "$RUNNER_TEMP/ragchew-cogito-candidate" \
              --review-artifact sanitized-editorial-review.json \
              --source-commit "$GITHUB_SHA" --build-epoch "$(git show -s --format=%cI HEAD)" \
              --github-output "$GITHUB_OUTPUT" \
              --editorial-rollout-stage canary_10 \
              --replacement-comparison-role candidate \
              --comparison-baseline paired-control-input/contemporaneous-control-baseline.json
          else
            uv run ragchew-scotus-static batch \
              --mode "$PUBLICATION_MODE" \
              --state-dir generated-content-input --candidate-state-dir candidate-state \
              --output candidate-site --workspace "$RUNNER_TEMP/ragchew-private" \
              --review-artifact sanitized-editorial-review.json \
              --source-commit "$GITHUB_SHA" --build-epoch "$(git show -s --format=%cI HEAD)" \
              --github-output "$GITHUB_OUTPUT" "${replay_args[@]}" \
              "${scheduled_retry_args[@]}" "${case_args[@]}" "${editorial_args[@]}"
          fi
      - name: Merge paired opaque receipts after any candidate outcome
        if: always() && inputs.editorial_rollout_stage == 'canary_10' && needs.paired-control.result == 'success'
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from ragchew.scotus.static_contracts import CostReceiptBundle, canonical_json_bytes

          paths = [Path("paired-control-receipts/control-public-cost-receipts.json")]
          candidate = Path("${{ runner.temp }}/ragchew-cogito-candidate/public-cost-receipts.json")
          if candidate.is_file():
              paths.append(candidate)
          bundles = tuple(CostReceiptBundle.model_validate_json(path.read_bytes()) for path in paths)
          receipts = tuple(
              sorted(
                  (receipt for bundle in bundles for receipt in bundle.receipts),
                  key=lambda item: (item.stage, item.input_fingerprint, item.attempt_number),
              )
          )
          merged = CostReceiptBundle(receipts=receipts)
          Path("${{ runner.temp }}/ragchew-private/public-cost-receipts.json").write_bytes(
              canonical_json_bytes(merged)
          )
          PY
      - name: Build fixture, validate, and exit
        id: fixture_batch
        if: (inputs.mode || 'nightly') == 'fixture'
        run: |
          set -euo pipefail
          uv run ragchew-scotus-static fixture-preview \
            --fixture tests/fixtures/static/one-case.json \
            --output candidate-site --source-commit "$GITHUB_SHA" \
            --build-epoch "$(git show -s --format=%cI HEAD)" \
            --github-output "$GITHUB_OUTPUT"
          uv run ragchew-scotus-static validate \
            --output candidate-site --privacy-scan
      - name: Select successful batch outputs
        id: batch
        if: success()
        env:
          LIVE_CHANGED: ${{ steps.live_batch.outputs.release_changed }}
          LIVE_READY: ${{ steps.live_batch.outputs.publication_ready }}
          LIVE_RELEASE: ${{ steps.live_batch.outputs.release_id }}
          LIVE_PARENT: ${{ steps.live_batch.outputs.expected_parent_release_id }}
          LIVE_PARENT_DIGEST: ${{ steps.live_batch.outputs.expected_parent_digest }}
          LIVE_REVIEW_ONLY: ${{ steps.live_batch.outputs.editorial_review_only }}
          IMPORT_CHANGED: ${{ steps.import_batch.outputs.release_changed }}
          IMPORT_READY: ${{ steps.import_batch.outputs.publication_ready }}
          IMPORT_RELEASE: ${{ steps.import_batch.outputs.release_id }}
          IMPORT_PARENT: ${{ steps.import_batch.outputs.expected_parent_release_id }}
          IMPORT_PARENT_DIGEST: ${{ steps.import_batch.outputs.expected_parent_digest }}
          EMPTY_CHANGED: ${{ steps.empty_batch.outputs.release_changed }}
          EMPTY_READY: ${{ steps.empty_batch.outputs.publication_ready }}
          EMPTY_RELEASE: ${{ steps.empty_batch.outputs.release_id }}
          EMPTY_PARENT: ${{ steps.empty_batch.outputs.expected_parent_release_id }}
          EMPTY_PARENT_DIGEST: ${{ steps.empty_batch.outputs.expected_parent_digest }}
          MIGRATION_CHANGED: ${{ steps.migration_batch.outputs.release_changed }}
          MIGRATION_READY: ${{ steps.migration_batch.outputs.publication_ready }}
          MIGRATION_RELEASE: ${{ steps.migration_batch.outputs.release_id }}
          MIGRATION_PARENT: ${{ steps.migration_batch.outputs.expected_parent_release_id }}
          MIGRATION_PARENT_DIGEST: ${{ steps.migration_batch.outputs.expected_parent_digest }}
          FIXTURE_CHANGED: ${{ steps.fixture_batch.outputs.release_changed }}
          FIXTURE_READY: ${{ steps.fixture_batch.outputs.publication_ready }}
          FIXTURE_RELEASE: ${{ steps.fixture_batch.outputs.release_id }}
          FIXTURE_PARENT: ${{ steps.fixture_batch.outputs.expected_parent_release_id }}
          FIXTURE_PARENT_DIGEST: ${{ steps.fixture_batch.outputs.expected_parent_digest }}
        run: |
          set -euo pipefail
          echo "release_changed=${LIVE_CHANGED:-${IMPORT_CHANGED:-${EMPTY_CHANGED:-${MIGRATION_CHANGED:-$FIXTURE_CHANGED}}}}" >> "$GITHUB_OUTPUT"
          echo "publication_ready=${LIVE_READY:-${IMPORT_READY:-${EMPTY_READY:-${MIGRATION_READY:-$FIXTURE_READY}}}}" >> "$GITHUB_OUTPUT"
          echo "release_id=${LIVE_RELEASE:-${IMPORT_RELEASE:-${EMPTY_RELEASE:-${MIGRATION_RELEASE:-$FIXTURE_RELEASE}}}}" >> "$GITHUB_OUTPUT"
          echo "expected_parent_release_id=${LIVE_PARENT:-${IMPORT_PARENT:-${EMPTY_PARENT:-${MIGRATION_PARENT:-$FIXTURE_PARENT}}}}" >> "$GITHUB_OUTPUT"
          echo "expected_parent_digest=${LIVE_PARENT_DIGEST:-${IMPORT_PARENT_DIGEST:-${EMPTY_PARENT_DIGEST:-${MIGRATION_PARENT_DIGEST:-$FIXTURE_PARENT_DIGEST}}}}" >> "$GITHUB_OUTPUT"
          echo "editorial_review_only=${LIVE_REVIEW_ONLY:-false}" >> "$GITHUB_OUTPUT"
      - name: Require reviewed approval before any publication-ready artifact
        if: steps.batch.outputs.publication_ready == 'true'
        run: |
          baseline_args=()
          if [[ -f paired-control-input/contemporaneous-control-baseline.json ]]; then
            baseline_args+=(--comparison-baseline paired-control-input/contemporaneous-control-baseline.json)
          fi
          uv run ragchew-scotus-static validate \
            --output candidate-site --state-dir candidate-state --privacy-scan \
            --require-approved-measurement "${baseline_args[@]}"
      - name: Validate opaque receipts before any upload
        id: receipts
        if: always()
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ragchew-private/public-cost-receipts.json"
          if [[ -f "$receipt" ]]; then
            uv run ragchew-scotus-static persist-cost-receipts \
              --receipts "$receipt" --validate-only
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload validated opaque cost receipts
        if: always() && steps.receipts.outcome == 'success' && steps.receipts.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opaque-cost-receipts
          path: ${{ runner.temp }}/ragchew-private/public-cost-receipts.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload sanitized contemporaneous Qwen control binding
        if: github.event_name == 'workflow_dispatch' && inputs.editorial_rollout_stage == 'canary_10' && inputs.deploy != true && steps.batch.outcome == 'success' && steps.receipts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitized-contemporaneous-control
          path: |
            paired-control-input/contemporaneous-control-baseline.json
            paired-control-input/sanitized-control-review.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload optional privacy-scanned Qwen control candidate
        if: github.event_name == 'workflow_dispatch' && inputs.editorial_rollout_stage == 'canary_10' && inputs.deploy != true && steps.batch.outcome == 'success' && steps.receipts.outcome == 'success' && hashFiles('paired-control-input/control-site/**') != '' && hashFiles('paired-control-input/control-state/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-qwen-control-candidate
          path: |
            paired-control-input/control-site
            paired-control-input/control-state
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Upload sanitized editorial manifest and aggregate report
        if: github.event_name == 'workflow_dispatch' && inputs.editorial_rollout_stage != 'disabled' && inputs.deploy != true && steps.batch.outcome == 'success' && steps.receipts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitized-editorial-review
          path: sanitized-editorial-review.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload scanned non-deploy dry-run candidate
        if: github.event_name == 'workflow_dispatch' && inputs.deploy != true && steps.batch.outcome == 'success' && steps.receipts.outcome == 'success' && steps.batch.outputs.editorial_review_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-static-candidate
          path: candidate-site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Upload sanitized publication-disabled editorial candidate state
        if: github.event_name == 'workflow_dispatch' && inputs.editorial_rollout_stage != 'disabled' && inputs.deploy != true && steps.batch.outcome == 'success' && steps.receipts.outcome == 'success' && steps.batch.outputs.editorial_review_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitized-editorial-candidate-state
          path: candidate-state
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
      - name: Upload exact Pages artifact
        if: steps.batch.outputs.release_changed == 'true' && steps.batch.outputs.publication_ready == 'true' && steps.receipts.outcome == 'success' && (github.event_name == 'schedule' || inputs.deploy == true)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: candidate-site
          retention-days: 1
      - name: Upload scanned public state for guarded promotion
        if: steps.batch.outputs.publication_ready == 'true' && steps.receipts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-content-candidate
          path: candidate-state
          if-no-files-found: error
          retention-days: 1
      - name: Write sanitized validated-candidate handoff metadata
        if: steps.batch.outputs.publication_ready == 'true' && steps.receipts.outcome == 'success'
        env:
          RELEASE_ID: ${{ steps.batch.outputs.release_id }}
          EXPECTED_PARENT_RELEASE_ID: ${{ steps.batch.outputs.expected_parent_release_id }}
          EXPECTED_PARENT_DIGEST: ${{ steps.batch.outputs.expected_parent_digest }}
          EXPECTED_PARENT_COMMIT: ${{ steps.state_sha.outputs.commit }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from ragchew.scotus.static_validation import scan_public_files

          path = Path("candidate-handoff.json")
          path.write_text(json.dumps({
              "schema_version": "1.1",
              "source_run_id": "${{ github.run_id }}",
              "source_commit": "${{ github.sha }}",
              "release_id": os.environ["RELEASE_ID"],
              "expected_parent_release_id": os.environ["EXPECTED_PARENT_RELEASE_ID"],
              "expected_parent_digest": os.environ["EXPECTED_PARENT_DIGEST"],
              "expected_parent_commit": os.environ["EXPECTED_PARENT_COMMIT"],
          }, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          scan_public_files((path,), labels=(path.name,))
          PY
      - name: Upload validated-candidate handoff metadata
        if: steps.batch.outputs.publication_ready == 'true' && steps.receipts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-candidate-handoff
          path: candidate-handoff.json
          if-no-files-found: error
          retention-days: 1
      # A manual deploy=false run retains only privacy-scanned public candidate/state,
      # handoff metadata, and opaque receipts for one day. No private evidence is uploaded.
      - name: Safe build summary
        if: always()
        env:
          DISCOVERED_COUNT: ${{ steps.live_batch.outputs.discovered_count || '0' }}
          PUBLISHED_COUNT: ${{ steps.live_batch.outputs.published_count || '0' }}
          DEFERRED_COUNT: ${{ steps.live_batch.outputs.deferred_count || '0' }}
          FAILED_COUNT: ${{ steps.live_batch.outputs.failed_count || '0' }}
          PENDING_COUNT: ${{ steps.live_batch.outputs.pending_count || '0' }}
          NEWEST_DISCOVERED: ${{ steps.live_batch.outputs.newest_discovered_activity_date || 'none' }}
          NEWEST_PUBLISHED: ${{ steps.live_batch.outputs.newest_published_activity_date || 'none' }}
          NEWEST_DEFERRED: ${{ steps.live_batch.outputs.newest_deferred_activity_date || 'none' }}
          NEWEST_FAILED: ${{ steps.live_batch.outputs.newest_failed_activity_date || 'none' }}
          NEWEST_PENDING: ${{ steps.live_batch.outputs.newest_pending_activity_date || 'none' }}
        run: |
          printf 'Build outcome: `%s`\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          printf 'Freshness: discovered=%s (newest=%s), published=%s (newest=%s), deferred=%s (newest=%s), failed=%s (newest=%s), pending=%s (newest=%s).\n' \
            "$DISCOVERED_COUNT" "$NEWEST_DISCOVERED" "$PUBLISHED_COUNT" "$NEWEST_PUBLISHED" \
            "$DEFERRED_COUNT" "$NEWEST_DEFERRED" "$FAILED_COUNT" "$NEWEST_FAILED" \
            "$PENDING_COUNT" "$NEWEST_PENDING" >> "$GITHUB_STEP_SUMMARY"
          printf 'Court/model candidates remain fail-closed unless every configured gate and validator passes.\n' >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.deploy }}" != "true" ]]; then
            printf 'Non-deploy dry run: validated public candidate/state and opaque receipts are retained for guarded deployment without model reprocessing.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Clean persistent runner after build
        if: always()
        run: |
          set -euo pipefail
          chmod -R u+rwX "$RUNNER_TEMP/ragchew-private" \
            "$RUNNER_TEMP/ragchew-qwen-control" \
            "$RUNNER_TEMP/ragchew-cogito-candidate" "$GITHUB_WORKSPACE" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/ragchew-private" \
            "$RUNNER_TEMP/ragchew-qwen-control" "$RUNNER_TEMP/ragchew-cogito-candidate" \
            "/dev/shm/ragchew-scotus-$GITHUB_RUN_ID"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          test ! -e "$RUNNER_TEMP/ragchew-private"
          test ! -e "$RUNNER_TEMP/ragchew-qwen-control"
          test ! -e "$RUNNER_TEMP/ragchew-cogito-candidate"
          test ! -e "/dev/shm/ragchew-scotus-$GITHUB_RUN_ID"
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)"

  persist-cost-receipts:
    name: Persist validated opaque receipts only
    needs: build
    if: always() && needs.build.outputs.expected_parent_commit != '' && (github.event_name == 'schedule' || inputs.deploy == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      generated_commit: ${{ steps.current.outputs.commit }}
    steps:
      - name: Check out source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out generated-content mutation target separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated-content
          path: generated-content
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.outputs.receipts_present == 'true'
        with:
          name: opaque-cost-receipts
          path: receipt
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --project source --frozen
      - name: CAS append without changing active release
        if: needs.build.outputs.receipts_present == 'true' && hashFiles('receipt/public-cost-receipts.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project source ragchew-scotus-static persist-cost-receipts \
            --state-dir generated-content \
            --receipts receipt/public-cost-receipts.json \
            --expected-parent-commit "${{ needs.build.outputs.expected_parent_commit }}"
      - name: Record current generated SHA for serialized promotion
        id: current
        run: echo "commit=$(git -C generated-content rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy exact Pages artifact
    needs: [build, persist-cost-receipts]
    if: always() && needs.build.result == 'success' && needs.build.outputs.release_changed == 'true' && needs.build.outputs.publication_ready == 'true' && (needs.persist-cost-receipts.result == 'success' || needs.build.outputs.expected_parent_commit == '') && (github.event_name == 'schedule' || inputs.deploy == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy with no source or model secrets
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  promote:
    name: Promote exact deployed public state
    needs: [build, persist-cost-receipts, deploy]
    if: needs.deploy.result == 'success' && needs.persist-cost-receipts.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out generated-content mutation target separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated-content
          path: generated-content
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-content-candidate
          path: candidate-state
      - name: Download paired comparison binding when present
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sanitized-contemporaneous-control
          path: comparison
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --project source --frozen
      - name: Compare-and-swap exact deployed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_args=()
          baseline="$(find comparison -name contemporaneous-control-baseline.json -type f -print -quit 2>/dev/null || true)"
          if [[ -n "$baseline" ]]; then baseline_args+=(--comparison-baseline "$baseline"); fi
          uv run --project source ragchew-scotus-static promote \
            --state-dir generated-content --candidate-state-dir candidate-state \
            --release-id "${{ needs.build.outputs.release_id }}" \
            --expected-parent-release-id "${{ needs.build.outputs.expected_parent_release_id }}" \
            --expected-parent-digest "${{ needs.build.outputs.expected_parent_digest }}" \
            --expected-parent-commit "${{ needs.persist-cost-receipts.outputs.generated_commit }}" \
            "${baseline_args[@]}"

  checkpoint-only:
    name: Promote successful no-change checkpoints
    needs: [build, persist-cost-receipts]
    if: needs.build.outputs.release_changed == 'false' && needs.build.outputs.publication_ready == 'true' && needs.persist-cost-receipts.result == 'success' && (github.event_name == 'schedule' || inputs.deploy == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out generated-content mutation target separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated-content
          path: generated-content
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-content-candidate
          path: candidate-state
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --project source --frozen
      - name: Advance only validated discovery checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project source ragchew-scotus-static promote \
            --state-dir generated-content --candidate-state-dir candidate-state \
            --checkpoint-only \
            --expected-parent-commit "${{ needs.persist-cost-receipts.outputs.generated_commit }}"
