name: ci

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed uv
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          enable-cache: false
      - name: Install the frozen development environment
        run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: Audit locked Python dependencies
        run: uv run --with pip-audit==2.9.0 pip-audit
      - name: Inventory dependency licenses
        run: uv run --with pip-licenses==5.0.0 pip-licenses --format=plain-vertical
      - name: Scan tracked repository and Docker context policy
        run: uv run python scripts/check-public-repository.py
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build --pull=false -f Containerfile -t ragchew:test .
      - name: Scan the local image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ragchew:test
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
