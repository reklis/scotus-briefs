name: Nightly Backfill & Docket Update

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      skip_backfill:
        description: Skip previous-term backfill
        type: boolean
        default: false

concurrency:
  group: scotus-nightly
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  nightly:
    runs-on: [self-hosted, ollama]
    timeout-minutes: 360
    env:
      LLM_BASE_URL: ${{ vars.OLLAMA_LLM_BASE_URL || 'http://192.168.1.81:11434/v1' }}
      LLM_MODEL: ${{ vars.OLLAMA_LLM_MODEL || 'gemma3:12b' }}
      LLM_MAX_TOKENS: "2500"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      # Steps run sequentially (and scotus.cli calls Ollama synchronously, one request at a time)
      # to avoid GPU contention on 192.168.1.81.
      - name: Backfill one previous term with Ollama
        if: ${{ !inputs.skip_backfill }}
        run: uv run python -u -m scotus.cli backfill

      - name: Monitor and explain current term with Ollama
        run: |
          uv run python -u -m scotus.cli monitor
          uv run python -u -m scotus.cli explain

      - name: Build static site
        env:
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: uv run python -u -m scotus.cli build

      - name: Commit updated dockets, PDFs, and explanations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/docket data/explanations documents
          if ! git diff --cached --quiet; then
            git commit -m "chore: nightly docket update and backfill"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: nightly
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
