name: Deploy retained validated SCOTUS candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful publish-pages run containing the retained validated candidate
        required: true
        type: string

concurrency:
  group: scotus-pages-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Revalidate retained public artifacts
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      release_id: ${{ steps.verify.outputs.release_id }}
      expected_parent_release_id: ${{ steps.verify.outputs.expected_parent_release_id }}
      expected_parent_digest: ${{ steps.verify.outputs.expected_parent_digest }}
      expected_parent_commit: ${{ steps.verify.outputs.expected_parent_commit }}
    steps:
      - name: Check out protected current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the protected default branch
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: test "$REF_PROTECTED" = true
      - name: Verify source run is a successful protected publication build
        id: source_run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run_path="repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID"
          test "$(gh api "$run_path" --jq .conclusion)" = success
          test "$(gh api "$run_path" --jq .path)" = .github/workflows/publish-pages.yml
          test "$(gh api "$run_path" --jq .head_branch)" = "${{ github.event.repository.default_branch }}"
          source_commit="$(gh api "$run_path" --jq .head_sha)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$source_commit" HEAD
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
      - name: Download retained Pages candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scanned-static-candidate
          path: candidate-site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download retained generated state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-content-candidate
          path: candidate-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Download retained handoff metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-candidate-handoff
          path: handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Install frozen validation dependencies
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --frozen
      - name: Revalidate exact retained site and state
        id: verify
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_COMMIT: ${{ steps.source_run.outputs.source_commit }}
        run: |
          set -euo pipefail
          uv run ragchew-scotus-static validate \
            --output candidate-site --state-dir candidate-state --privacy-scan
          uv run python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from ragchew.scotus.static_contracts import ReleaseManifest
          from ragchew.scotus.static_state import StaticStateStore

          handoff = json.loads(Path("handoff/candidate-handoff.json").read_text())
          expected_keys = {
              "schema_version", "source_run_id", "source_commit", "release_id",
              "expected_parent_release_id", "expected_parent_digest",
              "expected_parent_commit",
          }
          if set(handoff) != expected_keys or handoff["schema_version"] != "1.1":
              raise SystemExit("invalid candidate handoff contract")
          if handoff["source_run_id"] != os.environ["CANDIDATE_RUN_ID"]:
              raise SystemExit("candidate handoff run mismatch")
          if handoff["source_commit"] != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("candidate handoff source mismatch")
          commit = handoff["expected_parent_commit"]
          digest = handoff["expected_parent_digest"]
          if not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest):
              raise SystemExit("invalid candidate parent digest")
          if not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("invalid candidate parent commit")
          manifest = ReleaseManifest.model_validate_json(
              Path("candidate-site/release/v1/release.json").read_bytes()
          )
          state = StaticStateStore(Path("candidate-state")).load()
          if state.release is None or state.release.release_id != manifest.release_id:
              raise SystemExit("candidate site/state release mismatch")
          if handoff["release_id"] != manifest.release_id:
              raise SystemExit("candidate handoff release mismatch")
          if handoff["expected_parent_release_id"] != (manifest.previous_release_id or ""):
              raise SystemExit("candidate handoff parent release mismatch")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"release_id={manifest.release_id}\n")
              stream.write(
                  "expected_parent_release_id="
                  f"{handoff['expected_parent_release_id']}\n"
              )
              stream.write(f"expected_parent_digest={digest}\n")
              stream.write(f"expected_parent_commit={commit}\n")
          PY
      - name: Upload exact revalidated Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: candidate-site
          retention-days: 1

  persist-cost-receipts:
    name: Persist retained opaque receipts
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    outputs:
      generated_commit: ${{ steps.current.outputs.commit }}
    steps:
      - name: Check out current source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Check out generated-content mutation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated-content
          path: generated-content
          fetch-depth: 1
          persist-credentials: false
      - name: Download retained opaque receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opaque-cost-receipts
          path: receipt
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --project source --frozen
      - name: CAS append retained receipts without changing active release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project source ragchew-scotus-static persist-cost-receipts \
            --state-dir generated-content \
            --receipts receipt/public-cost-receipts.json \
            --expected-parent-commit "${{ needs.prepare.outputs.expected_parent_commit }}"
      - name: Record generated-content SHA
        id: current
        run: echo "commit=$(git -C generated-content rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy exact retained Pages artifact
    needs: [prepare, persist-cost-receipts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy with no source or model access
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  promote:
    name: Promote exact retained public state
    needs: [prepare, persist-cost-receipts, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out current source separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Check out generated-content mutation target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: generated-content
          path: generated-content
          fetch-depth: 1
          persist-credentials: false
      - name: Download retained generated state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-content-candidate
          path: candidate-state
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - run: uv sync --project source --frozen
      - name: Compare-and-swap exact deployed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --project source ragchew-scotus-static promote \
            --state-dir generated-content --candidate-state-dir candidate-state \
            --release-id "${{ needs.prepare.outputs.release_id }}" \
            --expected-parent-release-id "${{ needs.prepare.outputs.expected_parent_release_id }}" \
            --expected-parent-digest "${{ needs.prepare.outputs.expected_parent_digest }}" \
            --expected-parent-commit "${{ needs.persist-cost-receipts.outputs.generated_commit }}"
