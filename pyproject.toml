[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scotus-citizen-guide-pipeline"
version = "0.1.0"
description = "Ingestion and data contracts for the SCOTUS citizen guide"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27.2,<0.29",
  "pydantic>=2.9.2,<3",
  "pypdf>=5.1.0,<6",
]

[project.scripts]
scotus-guide = "scotus_guide.cli:main"
scotus-pipeline = "scotus_guide.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.23.0,<5",
  "mypy>=1.11.2,<2",
  "pytest>=8.3.3,<9",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.7.1,<0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["pipeline/scotus_guide"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pipeline"]
plugins = ["pydantic.mypy"]
