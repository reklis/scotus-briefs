[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scotus-guide"
version = "0.2.0"
description = "A citizen's guide to the Supreme Court: monitor the docket, explain proceedings in plain English, publish a static site."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pypdf>=5.0,<6",
]

[project.scripts]
scotus = "scotus.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["scotus"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
