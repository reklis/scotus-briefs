apiVersion: v1
kind: Secret
metadata: {name: ragchew-scotus-collector, namespace: ragchew}
type: Opaque
stringData:
  RAGCHEW_DATABASE_DSN: replace-with-collector-dsn
  RAGCHEW_S3_ACCESS_KEY: replace-with-collector-key
  RAGCHEW_S3_SECRET_KEY: replace-me
  RAGCHEW_SOURCE_USER_AGENT: "SCOTUS-Legal-Briefs/0.1 contact=replace-me@example.org"
---
apiVersion: v1
kind: Secret
metadata: {name: ragchew-scotus-analyzer, namespace: ragchew}
type: Opaque
stringData:
  RAGCHEW_DATABASE_DSN: replace-with-analyzer-dsn
  RAGCHEW_S3_ACCESS_KEY: replace-with-analyzer-key
  RAGCHEW_S3_SECRET_KEY: replace-me
  # Official OpenAI project key; extraction sends bounded evidence windows only.
  RAGCHEW_OPENAI_API_KEY: replace-with-openai-project-key
---
apiVersion: v1
kind: Secret
metadata: {name: ragchew-scotus-publisher, namespace: ragchew}
type: Opaque
stringData:
  RAGCHEW_DATABASE_DSN: replace-with-publisher-dsn
  # Official OpenAI project key; generation sends sanitized approved claims only.
  RAGCHEW_OPENAI_API_KEY: replace-with-openai-project-key
---
apiVersion: v1
kind: Secret
metadata: {name: ragchew-scotus-retention, namespace: ragchew}
type: Opaque
stringData:
  RAGCHEW_DATABASE_DSN: replace-with-retention-dsn
  RAGCHEW_S3_ACCESS_KEY: replace-with-retention-key
  RAGCHEW_S3_SECRET_KEY: replace-me
---
apiVersion: v1
kind: Secret
metadata: {name: ragchew-public-db, namespace: ragchew}
type: Opaque
stringData:
  # Use a role with SELECT only on active_scotus_public_projection.
  RAGCHEW_DATABASE_DSN: replace-with-read-only-public-dsn
