apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Static GitHub Pages is the only production reader boundary. This active base
# intentionally creates no application workload, Service, Ingress, Secret, database,
# object store, analyzer, or CronJob. The namespace remains only as a deletion-safe
# transition target for operators retiring an old installation.
resources:
  - namespace.yaml
