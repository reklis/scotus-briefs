version: "1.0"
product: scotus_legal_briefs
source_id: supreme_court
# The empty static site is live; case processing remains disabled until validation passes.
enabled: false
discovery:
  # Routine runs prioritize this term and revisit older terms through a bounded cursor.
  active_term: "2025"
  recent_correction_lookback_days: 183
  recent_opinion_lookback_days: 183
  historical_rechecks_per_run: 2
  terms:
    - "2025"
    - "2024"
    - "2023"
    - "2022"
    - "2021"
    - "2020"
    - "2019"
    - "2018"
    - "2017"
    - "2016"
    - "2015"
    - "2014"
    - "2013"
    - "2012"
    - "2011"
    - "2010"
    - "2009"
    - "2008"
    - "2007"
    - "2006"
    - "2005"
    - "2004"
    - "2003"
    - "2002"
    - "2001"
    - "2000"
  backfill_case_limit: 200
  backfill_lookback_days: 183
  backfill_priority: 100
  new_transcript_priority: 10
  poll_interval_seconds: 900
  crawl_delay_seconds: 1.0
documents:
  maximum_pdf_bytes: 52428800
  maximum_pages: 500
  allowed_content_types:
    - application/pdf
    - text/html
  spool_memory_bytes: 8388608
  download_audio: false
  stt_enabled: false
parser:
  name: pypdf
  version: "1"
  minimum_line_coverage: 0.99
  maximum_ambiguous_pages: 0
retention:
  copied_document_hours: 24
  extracted_text_days: 30
  failed_download_hours: 24
repository:
  owner: reklis
  name: scotus-briefs
static:
  output_path: build/pages
  generated_state_path: build/generated-content
  generated_state_schema: "1.0"
  canonical_origin: https://scotusbriefs.us
  project_base_path: /
  section_path: /scotus/
  static_only: true
  runtime_api_url: null
schedule:
  nightly_cron_utc: "17 3 * * *"
bootstrap:
  maximum_terms_per_run: 2
  # One whole case requires at least one extraction and one final brief call.
  maximum_cases_per_run: 1
  maximum_requests_per_run: 200
  maximum_download_bytes_per_run: 524288000
runner_limits:
  maximum_cases_per_run: 1
  maximum_documents_per_run: 20
  maximum_http_requests_per_run: 100
  maximum_download_bytes_per_run: 104857600
  maximum_private_disk_bytes: 2147483648
  maximum_runtime_seconds: 1500
model_budget:
  maximum_extraction_calls_per_run: 20
  maximum_brief_calls_per_run: 1
  maximum_total_calls_per_run: 21
  maximum_input_characters_per_run: 1200000
  maximum_input_tokens_per_run: 2100000
  maximum_output_tokens_per_run: 84000
  # First live dry run required 120,698 conservative UTF-8-byte tokens at the
  # bounded 60k-character evidence window.
  maximum_input_tokens_per_call: 130000
  maximum_output_tokens_per_call: 4000
  # The protected local Ollama runtime has no per-token charge.
  input_cost_usd_per_million_tokens: "0"
  output_cost_usd_per_million_tokens: "0"
  maximum_estimated_cost_usd_per_run: "0"
  # Large local-model extraction timed out at 120 seconds during launch validation.
  request_timeout_seconds: 420
  maximum_transport_attempts: 1
licensing:
  code_and_documentation: Apache-2.0
  generated_briefs: CC-BY-4.0
  court_materials_excluded: true
# Foundational approvals are recorded; generated-case launch remains fail-closed.
approvals:
  source_review_approved: true
  licenses_approved: true
  origin_approved: true
  model_runtime_approved: true
  launch_approved: false
generation:
  provider: ollama
  model: qwen3.8:27b
  prompt_version: scotus-brief-plain-language-v14
  brief_generation_enabled: false
  maximum_brief_api_calls_per_run: 1
  stop_after_brief_validation_failure: true
  audience: general_public
  maximum_context_characters: 60000
  minimum_observation_confidence: 0.85
  maximum_sentence_words: 30
  maximum_paragraph_words: 120
  public_quotes: false
  prohibit_vote_predictions: true
  prohibit_personalized_legal_advice: true
publication:
  enabled: true
  dry_run: true
  site_name: SCOTUS Legal Briefs
  base_path: /scotus
  case_page_requires_official_transcript: true
  event_driven: true
launch:
  minimum_private_preview_days: 7
  minimum_reviewed_cases: 20
  minimum_page_line_accuracy: 1.0
  minimum_grounded_factual_element_rate: 1.0
  maximum_status_upgrades: 0
  maximum_sensitive_leaks: 0
